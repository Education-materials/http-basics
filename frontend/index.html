<!DOCTYPE html>
<html lang="en">

<head>
    
    <meta charset="UTF-8">
    <title>Simple CRUD</title>
    
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <a href="index.html">CRUD</a>
        <a href="search.html">Search</a>
    </nav>
    
    <h1>Items</h1>
    
    <!-- Create item -->
    <form id="item-form">

        <input
            id="name"
            type="text"
            placeholder="Item name"
            required
        >

        <input
            id="price"
            type="number"
            step="0.01"
            placeholder="Price"
            required
        >

        <button type="submit">
            Add Item
        </button>

    </form>

    <hr>

    <!-- Items will appear here -->
    <ul id="items"></ul>


    <script src="app.js"></script>

</body>
</html>
